services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - portal_env
    image: fc-followup-portal:latest
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      # SKIP_UNAVAILABLE_CHANNELS / DEV_CALL_PHONE come from env_file (.env) only.
    volumes:
      # Persist local Miniflare / Wrangler state under the project directory.
      - ./.wrangler/state:/app/.wrangler/state
      - ./.sites-runtime:/app/.sites-runtime
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

secrets:
  portal_env:
    file: .env
